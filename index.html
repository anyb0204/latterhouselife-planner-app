<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latter House Life</title>
<meta name="description" content="Come on in. Let's get you ready. — Latter House Life">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== WELCOME SCREEN ===================== -->
<section id="welcome" class="welcome">
  <div class="welcome__bg" aria-hidden="true"></div>
  <div class="welcome__content">
    <p class="kicker">LATTER HOUSE LIFE</p>
    <h1 class="welcome__headline">Come on in.<br>Let&rsquo;s get you ready.</h1>
    <p class="welcome__sub">A quiet place to gather what you need &mdash; Scripture, community, tools, and wisdom for the road ahead.</p>
    <button type="button" id="enterBtn" class="btn-enter">
      <span>Enter</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</section>

<!-- ===================== CAROUSEL SCREEN ===================== -->
<main id="carousel" class="carousel" hidden aria-hidden="true">

  <header class="carousel__header">
    <span class="brand-mark">Latter House Life</span>
    <p class="brand-tagline">Choose a room to step into</p>
  </header>

  <div class="stage" id="stage">
    <div class="horseshoe" id="horseshoe">

      <!-- Resources — back center -->
      <button type="button" class="card card--resources" data-room="resources" style="--order:1">
        <span class="card__glow" aria-hidden="true"></span>
        <video class="card__video" muted loop playsinline preload="none"
               poster=""
               data-src="assets/videos/R_crashing_waves.mp4"></video>
        <span class="card__scrim" aria-hidden="true"></span>
        <span class="card__frame" aria-hidden="true"></span>
        <span class="card__content">
          <span class="card__eyebrow">Life-giving. Abundant.</span>
          <span class="card__title">Resources</span>
        </span>
      </button>

      <!-- Community — mid left -->
      <button type="button" class="card card--community" data-room="community" style="--order:2">
        <span class="card__glow" aria-hidden="true"></span>
        <video class="card__video" muted loop playsinline preload="none"
               poster=""
               data-src="assets/videos/C_group_of_old_men_talking.mp4"></video>
        <span class="card__scrim" aria-hidden="true"></span>
        <span class="card__frame" aria-hidden="true"></span>
        <span class="card__content">
          <span class="card__eyebrow">Real people. Real conversations.</span>
          <span class="card__title">Community</span>
        </span>
      </button>

      <!-- Scripture — mid right -->
      <button type="button" class="card card--scripture" data-room="scripture" style="--order:3">
        <span class="card__glow" aria-hidden="true"></span>
        <video class="card__video" muted loop playsinline preload="none"
               poster=""
               data-src="assets/videos/S_hands_on_bible.mp4"></video>
        <span class="card__scrim" aria-hidden="true"></span>
        <span class="card__frame" aria-hidden="true"></span>
        <span class="card__content">
          <span class="card__eyebrow">Immerse in the Word.</span>
          <span class="card__title">Scripture</span>
        </span>
      </button>

      <!-- Tools — front left -->
      <button type="button" class="card card--tools" data-room="tools" style="--order:4">
        <span class="card__glow" aria-hidden="true"></span>
        <video class="card__video" muted loop playsinline preload="none"
               poster=""
               data-src="assets/videos/T_man_working_with_tools.mp4"></video>
        <span class="card__scrim" aria-hidden="true"></span>
        <span class="card__frame" aria-hidden="true"></span>
        <span class="card__content">
          <span class="card__eyebrow">Build what God called you to build.</span>
          <span class="card__title">Tools</span>
        </span>
      </button>

      <!-- Library — front right -->
      <button type="button" class="card card--library" data-room="library" style="--order:5">
        <span class="card__glow" aria-hidden="true"></span>
        <video class="card__video" muted loop playsinline preload="none"
               poster=""
               data-src="assets/videos/L_woman_sitting_in_front_of_book_shelf.mp4"></video>
        <span class="card__scrim" aria-hidden="true"></span>
        <span class="card__frame" aria-hidden="true"></span>
        <span class="card__content">
          <span class="card__eyebrow">Wisdom for the road ahead.</span>
          <span class="card__title">Library</span>
        </span>
      </button>

    </div>
    <div class="stage__floor" aria-hidden="true"></div>
  </div>
</main>

<!-- ===================== ROOM MODAL ===================== -->
<div id="modal" class="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" class="modal__close" data-close aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
    </button>
    <div class="modal__media">
      <video id="modalVideo" class="modal__video" muted loop playsinline autoplay></video>
      <span class="modal__media-scrim" aria-hidden="true"></span>
    </div>
    <div class="modal__body">
      <p class="modal__eyebrow" id="modalEyebrow"></p>
      <h2 class="modal__title" id="modalTitle"></h2>
      <p class="modal__desc" id="modalDesc"></p>
      <a href="#" class="btn-room" id="modalCta">
        <span id="modalCtaLabel">Step in</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
